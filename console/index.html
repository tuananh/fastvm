<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%235eead4'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <title>fastvm console</title>
    <script>
      // Theme bootstrap: runs before the app bundle so the first paint already
      // matches the persisted/system theme (no dark/light flash).
      (function () {
        var STORAGE_KEY = "fastvm.console.theme";
        var mode = "auto";
        try {
          var stored = window.localStorage.getItem(STORAGE_KEY);
          if (stored === "dark" || stored === "light" || stored === "auto") {
            mode = stored;
          }
        } catch (error) {
          // localStorage can be unavailable (private mode / sandboxed iframe).
        }
        var prefersDark = true;
        try {
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (error) {
          // matchMedia is missing on very old browsers; default to dark.
        }
        var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        // Paint the page background before the stylesheet loads.
        root.style.backgroundColor = resolved === "light" ? "#f9fafb" : "#030712";
      })();
    </script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
