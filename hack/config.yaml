# fastvm demo configuration.
#
# Used by `make start` and the walkthrough in docs/GETTING_STARTED.md. It keeps
# all state under /tmp so trying fastvm needs no system-wide installation; for a
# real deployment copy this to /etc/fastvm/config.yaml and point
# data_dir/kernel_path/agent_path at /var/lib/fastvm/....
#
# Relative paths are resolved from the daemon's working directory, so run
# fastvmd from the repository root:
#   sudo bin/fastvmd -config hack/config.yaml
#
# The daemon needs root or CAP_NET_ADMIN (TAP/bridge/nftables) and, for the
# eBPF datapath, CAP_BPF; without CAP_BPF it automatically falls back to the
# Linux bridge. Cloud Hypervisor v54+ (and virtiofsd when host-directory volumes
# are used) must be installed; see the vmm section below.

# Directory for state.db, base images, sandboxes, volumes, and snapshots.
data_dir: /tmp/fastvm-cow/data # must be writable and large enough

# Unix socket for the local JSON API. The daemon creates it with mode 0600.
socket_path: /run/fastvm/fastvm.sock # absolute path; parent directory must be writable

# Guest kernel image and guest agent binary injected into new base images.
# `make assets` creates the current symlink at /tmp/fastvm/kernels/current.
kernel_path: /tmp/fastvm/kernels/current # current kernel symlink; switch with fastvmctl kernel use
agent_path: bin/fastvm-agent # absolute or relative to daemon cwd

# VMM executables (Cloud Hypervisor is the only supported VMM).
vmm:
  binary: cloud-hypervisor # Cloud Hypervisor executable: name on PATH or absolute path
  virtiofsd: virtiofsd # virtio-fs daemon for host volumes: name on PATH or absolute path

# Host-directory volumes shared into guests via virtio-fs.
# Each host path must be absolute and below one of the allowed prefixes.
host_volumes:
  allowed_prefixes: # absolute directory prefixes allowed for --volume host shares; [] denies all
    - /tmp # throwaway demo shares
    - /home/anh/Code/fastvm # local checkout shares

# Sandbox state machine: idle detection, auto-pause/offload, and wake policy.
lifecycle:
  idle_window: 60s # Running -> Idle debounce; duration string (500ms, 30s, 2m, 1h, 0s)
  pause_after: 10m # Idle -> Paused delay; 0s disables auto-pause
  offload_after: 30m # Paused -> Dormant delay; 0s disables offload
  destroy_after: 0s # sleeping/idle lifetime before delete; 0s = never
  on_workload_exit: idle # after workload exit: idle | pause | offload | stop

  idle_detection:
    cpu_threshold_pct: 1.0 # CPU % below this permits Idle; 0.0-100.0
    cpu_wake_pct: 5.0 # CPU % above this wakes Idle; 0.0-100.0 and >= cpu_threshold_pct
    sample_interval: 1s # CPU/block-I/O sampling period; duration > 0
    exit_hold: 3s # time CPU must stay above cpu_wake_pct; duration >= 0
    warmup: 1s # startup grace before idle detection; duration >= 0
    block_io_bytes: 65536 # block I/O at/above this counts as activity; integer >= 0
    keepalive_aware: true # true = pure ACKs/TCP keepalives are not activity; true | false
    ignore_ports: [] # ports that never count/wake; list of 1-65535 ports; [] = none

  wake_policy:
    tcp: true # wake on inbound TCP; true | false
    udp: true # wake on inbound UDP; true | false
    icmp: true # wake on inbound ICMP; true | false
    allowed_ports: [] # destination ports allowed to wake; 1-65535; [] = any unicast
    max_wakes_per_minute: 6 # per-sandbox wake rate limit; integer >= 0, 0 = unlimited
    coalesce_window: 100ms # burst window producing one wake; duration >= 0

# Guest RAM offload and host memory-pressure policy.
memory:
  offload_mode: file # guest RAM offload: file | never ("file" enables deep sleep)
  evict_above: 0.90 # host RAM fraction triggering eviction of oldest Paused; 0.0-1.0
  reserve_mb: 1024 # host memory kept free when scheduling/evicting; integer MiB >= 0

# Writable root-disk/image storage settings.
storage:
  cow: reflink # clone backend: reflink (XFS/Btrfs) | copy | dm-thin (not implemented)
  root_size_gb: 1 # base/root disk GiB for new images; integer >= 1; oversized rootfs fails
  discard_on_destroy: true # delete writable volume with sandbox; true | false

# Optional TCP JSON API with mutual TLS; the unix socket is always enabled.
api:
  host: 127.0.0.1:8443 # TCP API host:port; "" disables TCP; requires cert_path
  cert_path: /tmp/fastvm/certs/server # dir with ca.pem, cert.pem, key.pem; empty only when host is empty

# Guest networking and the host L2 forwarding datapath.
network:
  dns: [] # non-loopback IPv4 nameservers; [] mirrors host /etc/resolv.conf
  search: [] # search domains; [] mirrors host /etc/resolv.conf
  datapath:
    mode: bridge # L2 forwarding backend: ebpf | bridge
    isolate_sandboxes: true # drop sandbox-to-sandbox traffic; true | false
    wake_notify: true # arm wake notifications for sleeping ports; true | false
